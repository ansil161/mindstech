[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:gunicorn]
; Must stay on one line: supervisord has no backslash line continuation, so a
; wrapped command silently drops every flag after the first line (gunicorn then
; binds 127.0.0.1 and is unreachable from nginx).
command=gunicorn mindstech.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --access-logfile - --error-logfile - --log-level info
directory=/app/mindstech
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery]
command=celery -A mindstech worker --loglevel=info --concurrency=1
directory=/app/mindstech
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
