server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;

    # React SPA (built into the image by nginx/Dockerfile). Unknown paths fall
    # back to index.html so client-side routes like /admin/login resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite bundles plus the static images in client/public/assets/.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Proxy /api/ requests to Django Gunicorn server
    location /api/ {
        proxy_pass http://django-backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy and rewrite /ai/ requests to FastAPI microservice internal endpoints
    location /ai/ {
        rewrite ^/ai/(.*)$ /api/v1/internal/$1 break;
        proxy_pass http://ai-service:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve media files directly from shared docker volume
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
