# Default config: plain HTTP on any host name. Used for local development and
# for a VPS before it has a certificate. When SSL_DOMAIN is set and its
# Let's Encrypt certificate exists, 40-ssl-config.sh swaps in
# ssl.conf.template instead.
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/app.conf;
}
