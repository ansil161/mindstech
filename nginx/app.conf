# Site rules shared by every server block (HTTP-only and HTTPS). Included
# from nginx.conf and ssl.conf.template inside a `server { }`.

client_max_body_size 50M;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

root /usr/share/nginx/html;

# Resolve upstream containers through Docker's DNS on each request (cached
# 10s) rather than once at startup, so rebuilding django-backend or
# ai-service -- which gives them new IPs -- doesn't leave nginx proxying to
# a dead address (502) until it is restarted. Requires proxy_pass to use a
# variable.
resolver 127.0.0.11 valid=10s ipv6=off;
set $django_upstream http://django-backend:8000;
set $ai_upstream http://ai-service:8000;

# React SPA (built into the image by nginx/Dockerfile). Unknown paths fall
# back to index.html so client-side routes like /admin/login resolve.
location / {
    try_files $uri $uri/ /index.html;
}

# Vite's hashed bundles (name-<8 char hash>.js/.css): the content behind a
# given name never changes, so browsers may keep them for a year.
location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css)$" {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Un-hashed static files in client/public/assets/ (site images, uploads):
# cache for a week, then revalidate so a replaced image shows up.
location /assets/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, must-revalidate";
}

# The HTML shell must always be revalidated so a deploy is picked up on the
# next page load. Every SPA route (/contact, /about, ...) falls through to it.
location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
}

# Other static files in client/public (team photos, logos, icons, video).
location ~* "\.(png|jpe?g|gif|svg|webp|avif|ico|mp4|webm|woff2?)$" {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, must-revalidate";
}

# Build id polled by open tabs to detect a new deploy; never cache.
location = /version.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
}

# Proxy /api/ requests to Django Gunicorn server
location ^~ /api/ {
    proxy_pass $django_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Proxy and rewrite /ai/ requests to FastAPI microservice internal endpoints
location ^~ /ai/ {
    rewrite ^/ai/(.*)$ /api/v1/internal/$1 break;
    proxy_pass $ai_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Serve media files directly from shared docker volume
location ^~ /media/ {
    alias /app/media/;
    expires 30d;
    add_header Cache-Control "public, no-transform";
}
